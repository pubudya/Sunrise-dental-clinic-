<!DOCTYPE html>
<!-- List all scheduled patient appointments. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Appointments | Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="list">
<div class="app-layout">
    <div id="sidebar" class="sidebar"></div>
    <main class="main-content">
        <div class="page-header">
            <h1>All Appointments</h1>
            <p>View, open, or cancel scheduled patient appointments.</p>
        </div>
        <div class="card" id="tableBox"></div>
    </main>
</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
    requireLogin().then(async user => {
        if (!user) return;
        const result = await apiGet('/appointments');
        const box = document.getElementById('tableBox');
        if (!result.success || result.data.length === 0) {
            box.innerHTML = '<div class="alert alert-info"><span>&#9432;</span> No appointments yet. <a href="register.html">Register the first appointment</a>.</div>';
            return;
        }
        let rows = result.data.map(a => `
            <tr>
                <td><span class="badge badge-teal">${a.appointmentNumber}</span></td>
                <td>${a.patientName}</td>
                <td>${a.contactNumber}</td>
                <td>${a.dentistName}</td>
                <td>${a.treatmentType}</td>
                <td>${a.appointmentDate}</td>
                <td>${a.appointmentTime}</td>
                <td>
                    <a href="view-appointment.html?number=${a.appointmentNumber}" class="btn btn-secondary btn-sm">View</a>
                    <button type="button" class="btn btn-danger btn-sm" data-cancel-number="${a.appointmentNumber}">Cancel</button>
                </td>
            </tr>`).join('');
        box.innerHTML = `<div class="table-wrapper"><table class="data-table">
            <thead><tr><th>Appt. No.</th><th>Patient</th><th>Contact</th><th>Dentist</th><th>Treatment</th><th>Date</th><th>Time</th><th>Action</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`;
        bindCancelAppointmentButtons(box);
    });
</script>
</body>
</html>
