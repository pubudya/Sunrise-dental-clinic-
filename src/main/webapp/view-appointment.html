<!DOCTYPE html>
<!-- Search appointments by number, patient name, or mobile. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Appointment | Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="view">
<div class="app-layout">
    <div id="sidebar" class="sidebar"></div>
    <main class="main-content">
        <div class="page-header">
            <h1>Search Appointments</h1>
            <p>Search by appointment number, patient name, and/or mobile number. At least one field is required.</p>
        </div>
        <div id="alertBox"></div>
        <div class="card search-card">
            <form id="searchForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Appointment Number</label>
                        <input type="text" id="searchNumber" name="appointmentNumber" class="form-control"
                               placeholder="e.g., APT0001">
                    </div>
                    <div class="form-group">
                        <label>Patient Name</label>
                        <input type="text" id="searchName" name="patientName" class="form-control"
                               placeholder="Partial name match">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="searchMobile" name="contactNumber" class="form-control"
                               placeholder="10 digits" pattern="[0-9]{10}" maxlength="10">
                    </div>
                </div>
                <div class="form-actions" style="border-top:none; margin-top:0; padding-top:0;">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                </div>
            </form>
        </div>
        <div id="resultBox"></div>
    </main>
</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
    requireLogin();

    window.onAppointmentCancelled = function(number, message) {
        showAlert('alertBox', message, 'success');
        document.getElementById('resultBox').innerHTML = '';
        document.getElementById('searchForm').reset();
    };

    async function searchAppointments(criteria) {
        const params = new URLSearchParams();
        if (criteria.appointmentNumber) params.set('number', criteria.appointmentNumber);
        if (criteria.patientName) params.set('patientName', criteria.patientName);
        if (criteria.contactNumber) params.set('contactNumber', criteria.contactNumber);

        const result = await apiGet('/appointments?' + params.toString());
        const box = document.getElementById('resultBox');
        if (result.success) {
            renderAppointmentResults(box, result.data);
        } else {
            showAlert('alertBox', result.message, 'error');
            box.innerHTML = '';
        }
    }

    document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const number = document.getElementById('searchNumber').value.trim();
        const name = document.getElementById('searchName').value.trim();
        const mobile = document.getElementById('searchMobile').value.trim();

        if (!number && !name && !mobile) {
            showAlert('alertBox', 'Enter at least one search field.', 'error');
            return;
        }
        searchAppointments({ appointmentNumber: number, patientName: name, contactNumber: mobile });
    });

    document.getElementById('clearBtn').addEventListener('click', function() {
        document.getElementById('searchForm').reset();
        document.getElementById('resultBox').innerHTML = '';
        document.getElementById('alertBox').innerHTML = '';
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('number')) {
        document.getElementById('searchNumber').value = params.get('number');
        searchAppointments({ appointmentNumber: params.get('number'), patientName: '', contactNumber: '' });
    }
</script>
</body>
</html>
